[package]
name = "nimbus"
description = "One CLI for instance, storage, and network provisioning across cloud providers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nimbus"
path = "src/main.rs"

[dependencies]
nimbus-cloud = { path = "../lib" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
keyring = "4"
rpassword = "7"

[dev-dependencies]
axum = "0.8"
nimbus-mock = { path = "../mock" }
reqwest = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["full"] }
